name: Windows build

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: windows/requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller==6.22.3 pytest

      - name: Tests (silent, no API calls)
        run: python -m pytest -q

      - name: Download models
        run: python scripts/fetch_models.py

      - name: Build app
        run: pyinstaller mycroft.spec --noconfirm

      - name: Smoke test the built app
        shell: pwsh
        run: |
          $env:MYCROFT_HOME = "$env:RUNNER_TEMP\mycroft-home"
          .\dist\Mycroft\mycroft-cli.exe --check --voices
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build installer
        shell: pwsh
        run: |
          $env:MYCROFT_VERSION = "0.1.$env:GITHUB_RUN_NUMBER"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Mycroft-Setup
          path: windows/dist/Mycroft-Setup-*.exe
          retention-days: 30
